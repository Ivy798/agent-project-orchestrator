name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          python apo.py selftest
      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version}\n"
          start = changelog.index(marker) + len(marker)
          end = changelog.find("\n## ", start)
          notes = changelog[start:] if end == -1 else changelog[start:end]
          Path("release-notes.md").write_text(notes.strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file release-notes.md --title "Agent Project Orchestrator ${GITHUB_REF_NAME}"

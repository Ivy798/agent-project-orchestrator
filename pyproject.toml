[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-orchestrator"
version = "1.2.0"
description = "Repo-centered controller and worktree orchestration tooling for agent-first software delivery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["agents", "codex", "git", "worktree", "orchestration", "software-delivery"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
apo = "agent_project_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_project_orchestrator = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
